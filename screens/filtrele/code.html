              "fontFamily": {

<body class="bg-background text-on-background min-h-screen font-body-md pb-24 md:pb-0">
<!-- Header -->
<header class="flex justify-between items-center w-full px-container-margin py-stack-md bg-transparent flat no shadows docked full-width top-0 z-10 sticky">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background font-bold">Filtrele</h1>
<button class="text-primary font-body-md font-medium hover:opacity-80 transition-opacity">
            Temizle
        </button>
</header>
<!-- Main Content -->
<main class="px-container-margin pt-4 flex flex-col gap-section-gap">
<!-- Category Section -->
<section>
<h2 class="font-headline-md text-headline-md mb-stack-md">Kategori</h2>
<div class="flex flex-wrap gap-2">
<!-- Selected Chip -->
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-body-sm font-medium transition-colors">
                    Tümü
                </button>
<!-- Unselected Chips -->
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Televizyon
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Telefon
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Bilgisayar
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Beyaz Eşya
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Küçük Ev Aletleri
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Mobilya
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Mutfak Ürünleri
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Oyun / Konsol
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Diğer
                </button>
</div>
</section>
<!-- Warranty Status Section -->
<section>
<h2 class="font-headline-md text-headline-md mb-stack-md">Garanti Durumu</h2>
<div class="flex flex-wrap gap-2">
<!-- Selected Chip -->
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-body-sm font-medium transition-colors">
                    Tümü
                </button>
<!-- Unselected Chips -->
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Devam Eden
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Yakında Bitecek
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm font-medium hover:bg-surface-variant transition-colors border border-transparent">
                    Bitmiş
                </button>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-background border-t border-outline-variant/30 md:relative md:border-none md:bg-transparent md:mt-auto pb-safe">
<button class="w-full bg-primary hover:opacity-90 text-on-primary font-body-lg rounded-xl py-3 transition-opacity">
            Uygula
        </button>
</div>
<script>
        // Simple chip selection logic for interaction demonstration
        const chipGroups = document.querySelectorAll('section');
        
        chipGroups.forEach(group => {
            const chips = group.querySelectorAll('button');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Deselect all in group
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-on-primary');
                        c.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                    });
                    // Select clicked
                    chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    chip.classList.add('bg-primary', 'text-on-primary');
                });
            });
        });
    </script>
