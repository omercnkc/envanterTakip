<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#e6eeff", "on-secondary-container": "#626566", "on-tertiary-container": "#000703", "on-tertiary-fixed": "#002113", "on-secondary-fixed-variant": "#454748", "on-primary-fixed-variant": "#2f2ebe", "secondary": "#5c5f60", "on-primary": "#ffffff", "inverse-surface": "#27313f", "on-primary-container": "#fffbff", "primary-fixed": "#e1e0ff", "surface-container-low": "#eff4ff", "secondary-fixed": "#e1e3e4", "surface-bright": "#f8f9ff", "tertiary-fixed-dim": "#4edea3", "on-secondary-fixed": "#191c1d", "primary": "#4648d4", "inverse-primary": "#c0c1ff", "error": "#ba1a1a", "surface-tint": "#494bd6", "tertiary": "#006c49", "surface": "#f8f9ff", "secondary-container": "#e1e3e4", "tertiary-container": "#00885d", "primary-container": "#6063ee", "on-tertiary-fixed-variant": "#005236", "surface-dim": "#d0dbed", "surface-variant": "#d9e3f6", "on-error-container": "#93000a", "on-error": "#ffffff", "surface-container-high": "#dee9fc", "on-surface-variant": "#464554", "primary-fixed-dim": "#c0c1ff", "background": "#f8f9ff", "inverse-on-surface": "#eaf1ff", "on-surface": "#121c2a", "outline-variant": "#c7c4d7", "surface-container-lowest": "#ffffff", "surface-container-highest": "#d9e3f6", "secondary-fixed-dim": "#c5c7c8", "outline": "#767586", "on-primary-fixed": "#07006c", "tertiary-fixed": "#6ffbbe", "on-background": "#121c2a", "on-secondary": "#ffffff", "error-container": "#ffdad6", "on-tertiary": "#ffffff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "section-gap": "2rem", "stack-md": "1rem", "container-margin": "1rem", "stack-sm": "0.5rem", "stack-lg": "1.5rem", "gutter": "1rem" }, "fontFamily": { "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-md": ["Inter"] }, "fontSize": { "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg-mobile": ["22px", { "lineHeight": "30px", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background text-on-surface min-h-screen flex flex-col"><main class="flex-1 flex flex-col w-full px-container-margin pt-safe pb-safe"><div class="flex flex-col w-full h-full min-h-[calc(100vh-env(safe-area-inset-top)-env(safe-area-inset-bottom)-4rem)] justify-center py-stack-lg">
<div class="flex flex-col gap-2 mb-8 items-center text-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-[32px]">inventory_2</span>
</div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Hesap Oluştur</h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px]">Hemen katılın ve varlıklarınızı güvenle yönetmeye başlayın.</p>
</div>
<form class="flex flex-col gap-4 w-full bg-surface-container-lowest p-6 rounded-2xl shadow-sm border border-outline-variant/30">
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface" for="fullName">Ad Soyad</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-lowest border border-outline-variant text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="fullName" placeholder="Örn: Ahmet Yılmaz" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface" for="email">E-posta Adresi</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-lowest border border-outline-variant text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" placeholder="ornek@sirket.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface" for="password">Şifre</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded-lg bg-surface-container-lowest border border-outline-variant text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface" for="passwordConfirm">Şifre Tekrar</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">lock_reset</span>
<input class="w-full h-12 pl-10 pr-10 rounded-lg bg-surface-container-lowest border border-outline-variant text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="passwordConfirm" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('passwordConfirm', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 mt-2">
<div class="relative flex items-center justify-center w-5 h-5 mt-0.5">
<input class="peer appearance-none w-5 h-5 border border-outline rounded bg-surface-container-lowest checked:bg-primary checked:border-primary cursor-pointer transition-all" id="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="text-body-sm font-body-sm text-on-surface-variant cursor-pointer leading-tight" for="terms">
<a class="text-primary font-medium hover:underline" href="#">Kullanım Koşulları</a>'nı ve <a class="text-primary font-medium hover:underline" href="#">Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
            </label>
</div>
<button class="w-full h-12 mt-4 bg-primary text-on-primary rounded-lg text-body-lg font-body-lg flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors shadow-sm active:scale-[0.98]" type="submit">
            Kayıt Ol
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
            Zaten bir hesabınız var mı? 
            <a class="text-primary font-semibold hover:underline inline-flex items-center gap-1" href="#">
                Giriş Yap
            </a>
</p>
</div>
</div>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('.material-symbols-outlined');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    // Form submission animation mock
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> İşleniyor...';
        btn.classList.add('opacity-80', 'pointer-events-none');
        
        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> Başarılı';
            btn.classList.remove('bg-primary', 'hover:bg-surface-tint');
            btn.classList.add('bg-tertiary', 'text-on-tertiary');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.add('bg-primary', 'hover:bg-surface-tint');
                btn.classList.remove('bg-tertiary', 'text-on-tertiary', 'opacity-80', 'pointer-events-none');
            }, 2000);
        }, 1500);
    });
</script></main></body></html>
