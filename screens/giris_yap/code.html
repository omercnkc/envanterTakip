</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Şifre</label>

<button class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center p-1" onclick="const p = document.getElementById('password'); const i = this.querySelector('span'); if(p.type === 'password'){p.type='text'; i.innerText='visibility_off';}else{p.type='password'; i.innerText='visibility';}" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>

<div class="h-px bg-outline-variant/30 flex-1"></div>
