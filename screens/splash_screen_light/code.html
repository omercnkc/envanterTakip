<!-- Main Content Container -->
<div class="z-10 flex flex-col items-center justify-center flex-1 w-full px-container-margin animate-[fade-in-up_0.8s_ease-out_forwards]">
<!-- Logo -->
<div class="relative mb-stack-lg group">
<div class="absolute -inset-4 bg-primary-container/20 rounded-full blur-xl opacity-50 animate-pulse"></div>
<div class="w-24 h-24 bg-surface-container rounded-2xl flex items-center justify-center shadow-md relative overflow-hidden transition-transform duration-500 group-hover:scale-105">
<!-- Inner glow/gradient -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    inventory_2
                </span>
<!-- Shimmer effect -->
<div class="absolute top-0 left-0 w-[200%] h-full bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-[150%] animate-[shimmer_2.5s_infinite_ease-in-out]"></div>
</div>
</div>
<!-- Title & Subtitle -->
<div class="text-center space-y-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
                Premium Core
            </h1>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-80">
                Inventory
            </h2>
</div>
</div>
<!-- Bottom Section: Loading Status -->
<div class="z-10 w-full px-container-margin pb-stack-lg flex flex-col items-center justify-center mt-auto animate-[fade-in_1.5s_ease-out_forwards]">
<!-- Loading Indicator -->
<div class="flex items-center justify-center gap-1.5 mb-stack-sm h-4">
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-[bounce_1s_infinite_-0.3s]"></div>
<div class="w-1.5 h-1.5 bg-primary/70 rounded-full animate-[bounce_1s_infinite_-0.15s]"></div>
<div class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-[bounce_1s_infinite]"></div>
</div>
<!-- Status Text -->
<p class="font-body-sm text-body-sm text-on-surface-variant text-center" id="loading-text">
            Authenticating secure connection...
        </p>
</div>
<style>
        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-150%) skewX(-15deg);
            }
            100% {
                transform: translateX(100%) skewX(-15deg);
            }
        }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loading-text');
            const states = [
                "Authenticating secure connection...",
                "Retrieving asset metadata...",
                "Synchronizing databases...",
                "Preparing workspace..."
            ];
            
            let currentState = 0;
            
            setInterval(() => {
                currentState = (currentState + 1) % states.length;
                loadingText.style.opacity = '0';
                
                setTimeout(() => {
                    loadingText.textContent = states[currentState];
                    loadingText.style.transition = 'opacity 0.3s ease';
                    loadingText.style.opacity = '1';
                }, 300);
                
            }, 2500);
        });
    </script>
